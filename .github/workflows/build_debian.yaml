name: Build Debian package
on:
    release:
        types: [published]
concurrency: ${{ github.workflow }}
permissions: {} # We use ELEMENT_BOT_TOKEN instead
jobs:
    build:
        name: Build package
        environment: packages.matron.chat
        runs-on: ubuntu-24.04
        env:
            R2_INCOMING_BUCKET: ${{ vars.R2_INCOMING_BUCKET }}
            R2_URL: ${{ vars.CF_R2_S3_API }}
            VERSION: ${{ github.ref_name }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Download package
              run: |
                  wget "https://github.com/matronhq/matron-web/releases/download/$VERSION/matron-$VERSION.tar.gz"
                  wget "https://github.com/matronhq/matron-web/releases/download/$VERSION/matron-$VERSION.tar.gz.asc"

            - name: Check GPG signature
              run: |
                  wget "https://packages.matron.chat/matron-release-key.gpg"
                  gpg --import matron-release-key.gpg
                  gpg --fingerprint "$FINGERPRINT"
                  gpg --verify "matron-$VERSION.tar.gz.asc" "matron-$VERSION.tar.gz"
              env:
                  FINGERPRINT: ${{ vars.GPG_FINGERPRINT }}

            - name: Prepare
              run: |
                  mkdir -p debian/tmp/DEBIAN
                  find debian -maxdepth 1 -type f -exec cp "{}" debian/tmp/DEBIAN/ \;
                  mkdir -p debian/tmp/usr/share/matron-web/ debian/tmp/etc/matron-web/

                  tar -xf "matron-$VERSION.tar.gz" -C debian/tmp/usr/share/matron-web --strip-components=1 --no-same-owner --no-same-permissions
                  mv debian/tmp/usr/share/matron-web/config.sample.json debian/tmp/etc/matron-web/config.json
                  ln -s /etc/matron-web/config.json debian/tmp/usr/share/matron-web/config.json

            - name: Write changelog
              run: |
                  VERSION=$(cat package.json | jq -r .version)
                  TIME=$(date -d "$PUBLISHED_AT" -R)
                  {
                      echo "matron-web ($VERSION) default; urgency=medium"
                      echo "$BODY" | sed 's/^##/\n  */g;s/^\*/  */g' | perl -pe 's/\[.+?]\((.+?)\)/\1/g'
                      echo ""
                      echo " -- $ACTOR <support@matron.chat>  $TIME"
                  } > debian/tmp/DEBIAN/changelog
              env:
                  ACTOR: ${{ github.actor }}
                  VERSION: ${{ github.event.release.tag_name }}
                  BODY: ${{ github.event.release.body }}
                  PUBLISHED_AT: ${{ github.event.release.published_at }}

            - name: Build deb package
              run: |
                  VERSION=$(cat package.json | jq -r .version)
                  dpkg-gencontrol -v"$VERSION" -ldebian/tmp/DEBIAN/changelog
                  dpkg-deb -Zxz --root-owner-group --build debian/tmp matron-web.deb

            - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: matron-web.deb
                  path: matron-web.deb
                  retention-days: 14

            - name: Publish to packages.matron.chat
              if: github.event.release.prerelease == false
              uses: matronhq/packages.matron.chat@master
              with:
                  file: matron-web.deb
                  github-token: ${{ secrets.ELEMENT_BOT_TOKEN }}
                  bucket-api: ${{ vars.CF_R2_S3_API }}
                  bucket-key-id: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
                  bucket-access-key: ${{ secrets.CF_R2_TOKEN }}
