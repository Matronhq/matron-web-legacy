name: Cut branches
on:
    workflow_dispatch:
        inputs:
            matron-desktop:
                description: Prepare matron-desktop
                required: true
                type: boolean
                default: true
            matron-web:
                description: Prepare matron-web
                required: true
                type: boolean
                default: true
            matrix-js-sdk:
                description: Prepare matrix-js-sdk
                required: true
                type: boolean
                default: true
permissions: {} # Uses ELEMENT_BOT_TOKEN instead
jobs:
    checks:
        name: Sanity checks
        strategy:
            matrix:
                repo:
                    - matrix-org/matrix-js-sdk
                    - matronhq/matron-web
                    - matronhq/matron-desktop
        uses: matrix-org/matrix-js-sdk/.github/workflows/release-checks.yml@develop
        secrets:
            ELEMENT_BOT_TOKEN: ${{ secrets.ELEMENT_BOT_TOKEN }}
        with:
            repository: ${{ matrix.repo }}

    prepare:
        runs-on: ubuntu-24.04
        needs: checks
        env:
            # The order is specified bottom-up to avoid any races for allchange
            REPOS: matrix-js-sdk matron-web matron-desktop
        steps:
            - name: Checkout Matron Desktop
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              if: inputs.matron-desktop
              with:
                  repository: matronhq/matron-desktop
                  path: matron-desktop
                  ref: staging
                  fetch-depth: 0
                  fetch-tags: true
                  token: ${{ secrets.ELEMENT_BOT_TOKEN }}
            - name: Checkout Matron Web
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              if: inputs.matron-web
              with:
                  repository: matronhq/matron-web
                  path: matron-web
                  ref: staging
                  fetch-depth: 0
                  fetch-tags: true
                  token: ${{ secrets.ELEMENT_BOT_TOKEN }}
            - name: Checkout Matrix JS SDK
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              if: inputs.matrix-js-sdk
              with:
                  repository: matrix-org/matrix-js-sdk
                  path: matrix-js-sdk
                  ref: staging
                  fetch-depth: 0
                  fetch-tags: true
                  token: ${{ secrets.ELEMENT_BOT_TOKEN }}

            - name: Prepare Git
              run: |
                  git config --global user.email "releases@riot.im"
                  git config --global user.name "RiotRobot"

            - name: Merge Matron Desktop
              if: inputs.matron-desktop
              run: |
                  git -C "matron-desktop" merge origin/develop
            - name: Merge Matron Web
              if: inputs.matron-web
              run: |
                  git -C "matron-web" merge origin/develop
            - name: Merge JS SDK
              if: inputs.matrix-js-sdk
              run: |
                  git -C "matrix-js-sdk" merge origin/develop

            - name: Push staging
              run: for REPO in $REPOS; do [ -d "$REPO" ] && git -C "$REPO" push origin staging; done

            - name: Wait for matrix-js-sdk draft
              if: inputs.matrix-js-sdk
              uses: t3chguy/wait-on-check-action@18541021811b56544d90e0f073401c2b99e249d6 # fork
              with:
                  ref: staging
                  repo: matrix-org/matrix-js-sdk
                  repo-token: ${{ secrets.ELEMENT_BOT_TOKEN }}
                  wait-interval: 10
                  check-name: "draft / draft"
                  allowed-conclusions: success

            - name: Wait for matron-web draft
              if: inputs.matron-web
              uses: t3chguy/wait-on-check-action@18541021811b56544d90e0f073401c2b99e249d6 # fork
              with:
                  ref: staging
                  repo: matronhq/matron-web
                  repo-token: ${{ secrets.ELEMENT_BOT_TOKEN }}
                  wait-interval: 10
                  check-name: "draft / draft"
                  allowed-conclusions: success

            - name: Wait for matron-desktop draft
              if: inputs.matron-desktop
              uses: t3chguy/wait-on-check-action@18541021811b56544d90e0f073401c2b99e249d6 # fork
              with:
                  ref: staging
                  repo: matronhq/matron-desktop
                  repo-token: ${{ secrets.ELEMENT_BOT_TOKEN }}
                  wait-interval: 10
                  check-name: "draft / draft"
                  allowed-conclusions: success
