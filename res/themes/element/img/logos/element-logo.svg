<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D5F8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0C0C0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8E8E8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC2222;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#1A1A2E" />
  <circle cx="256" cy="256" r="230" fill="#16213E" />

  <!-- Antenna -->
  <line x1="256" y1="95" x2="256" y2="60" stroke="#A0A0A0" stroke-width="4" stroke-linecap="round" />
  <circle cx="256" cy="52" r="10" fill="#4A90D9" />
  <circle cx="256" cy="52" r="6" fill="#6BB5FF" opacity="0.8" />

  <!-- Nurse/Matron cap -->
  <path d="M 180 130 Q 180 95 256 90 Q 332 95 332 130 L 320 140 L 192 140 Z" fill="url(#capGrad)" stroke="#D0D0D0" stroke-width="1.5" />

  <!-- Red cross on cap -->
  <rect x="244" y="100" width="24" height="30" rx="2" fill="url(#crossGrad)" />
  <rect x="241" y="108" width="30" height="14" rx="2" fill="url(#crossGrad)" />

  <!-- Robot head -->
  <rect x="170" y="135" width="172" height="130" rx="25" fill="url(#headGrad)" stroke="#A0A0A0" stroke-width="2" />

  <!-- Ear panels -->
  <rect x="152" y="165" width="22" height="60" rx="8" fill="#B0B0B0" stroke="#909090" stroke-width="1.5" />
  <rect x="338" y="165" width="22" height="60" rx="8" fill="#B0B0B0" stroke="#909090" stroke-width="1.5" />

  <!-- Eyes -->
  <ellipse cx="218" cy="190" rx="24" ry="22" fill="#1A1A2E" />
  <ellipse cx="294" cy="190" rx="24" ry="22" fill="#1A1A2E" />
  <!-- Eye glow -->
  <ellipse cx="218" cy="190" rx="18" ry="16" fill="#4A90D9" />
  <ellipse cx="294" cy="190" rx="18" ry="16" fill="#4A90D9" />
  <!-- Eye highlights -->
  <ellipse cx="224" cy="184" rx="6" ry="5" fill="#FFFFFF" opacity="0.6" />
  <ellipse cx="300" cy="184" rx="6" ry="5" fill="#FFFFFF" opacity="0.6" />
  <!-- Pupils -->
  <circle cx="218" cy="192" r="6" fill="#1A1A2E" />
  <circle cx="294" cy="192" r="6" fill="#1A1A2E" />

  <!-- Friendly smile -->
  <path d="M 226 225 Q 256 248 286 225" stroke="#707070" stroke-width="3.5" fill="none" stroke-linecap="round" />

  <!-- Cheek blush -->
  <ellipse cx="198" cy="218" rx="12" ry="8" fill="#FF8888" opacity="0.3" />
  <ellipse cx="314" cy="218" rx="12" ry="8" fill="#FF8888" opacity="0.3" />

  <!-- Neck -->
  <rect x="236" y="265" width="40" height="20" rx="4" fill="#A0A0A0" />

  <!-- Body / uniform -->
  <path d="M 175 285 Q 170 285 168 295 L 155 400 Q 153 415 170 418 L 342 418 Q 359 415 357 400 L 344 295 Q 342 285 337 285 Z" fill="url(#bodyGrad)" stroke="#2D5F8A" stroke-width="2" />

  <!-- White apron/collar -->
  <path d="M 215 285 L 210 380 L 302 380 L 297 285 Z" fill="#FFFFFF" opacity="0.85" />

  <!-- Red cross on body (medical symbol) -->
  <rect x="247" y="310" width="18" height="50" rx="2" fill="url(#crossGrad)" />
  <rect x="238" y="325" width="36" height="18" rx="2" fill="url(#crossGrad)" />

  <!-- Arms -->
  <path d="M 168 300 L 120 360 Q 112 372 122 378 L 130 378 Q 140 378 142 366 L 170 320" fill="url(#bodyGrad)" stroke="#2D5F8A" stroke-width="2" />
  <path d="M 344 300 L 392 360 Q 400 372 390 378 L 382 378 Q 372 378 370 366 L 342 320" fill="url(#bodyGrad)" stroke="#2D5F8A" stroke-width="2" />

  <!-- Hands -->
  <circle cx="126" cy="378" r="14" fill="#C0C0C0" stroke="#A0A0A0" stroke-width="1.5" />
  <circle cx="386" cy="378" r="14" fill="#C0C0C0" stroke="#A0A0A0" stroke-width="1.5" />

  <!-- Clipboard in right hand -->
  <rect x="370" y="365" width="35" height="45" rx="3" fill="#F5DEB3" stroke="#D4A854" stroke-width="1.5" />
  <line x1="377" y1="375" x2="398" y2="375" stroke="#A0A0A0" stroke-width="1.5" />
  <line x1="377" y1="382" x2="395" y2="382" stroke="#A0A0A0" stroke-width="1.5" />
  <line x1="377" y1="389" x2="398" y2="389" stroke="#A0A0A0" stroke-width="1.5" />
  <line x1="377" y1="396" x2="390" y2="396" stroke="#A0A0A0" stroke-width="1.5" />

  <!-- Speech bubble with chat icon -->
  <path d="M 350 100 Q 350 80 370 80 L 430 80 Q 450 80 450 100 L 450 130 Q 450 150 430 150 L 380 150 L 360 170 L 365 150 Q 350 150 350 130 Z" fill="#FFFFFF" opacity="0.9" />
  <!-- Chat bubble dots -->
  <circle cx="385" cy="115" r="6" fill="#4A90D9" />
  <circle cx="403" cy="115" r="6" fill="#4A90D9" />
  <circle cx="421" cy="115" r="6" fill="#4A90D9" />

  <!-- Subtle glow effect around eyes -->
  <ellipse cx="218" cy="190" rx="26" ry="24" fill="none" stroke="#4A90D9" stroke-width="1" opacity="0.3" />
  <ellipse cx="294" cy="190" rx="26" ry="24" fill="none" stroke="#4A90D9" stroke-width="1" opacity="0.3" />
</svg>